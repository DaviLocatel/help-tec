</head>
<body>
  <!-- Navbar Padrão -->
  <nav class="navbar">
    <a href="inicio.html" class="logo-link"><img src="logo.png" alt="Logo Help-Tec" class="logo-img"></a>
    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="menu-btn">☰</label>
    <div class="menu-colapsavel">
      <div class="navegacao-setas">
        <ul class="menu-lista">
          <li><a href="inicio.html">Início</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="produtos.html">Produtos</a></li>

  </nav>

  <main class="container-principal">
    <article class="card">
      <h2 style="text-align: center; margin-bottom: 24px;">Criar Minha Conta</h2>
      
      <form action="#" class="form-estilizado form-grid">
        <div><label>E-mail:</label><input type="email" placeholder="seu@email.com" required></div>
        <div><label>CPF:</label><input type="text" placeholder="000.000.000-00" required></div>
        <div><label>Data de Nascimento:</label><input type="date" required></div>
        <div><label>Foto de Perfil:</label><input type="file" accept="image/*"></div>
        <div style="grid-column: 1 / -1; text-align: center;">
          <button type="button" class="btn-comprar" style="width: 100%; max-width: 300px; margin-top: 16px;">Finalizar Cadastro</button>
        </div>
      </form>
      
      <div class="links-form" style="text-align: center;">
        <p>Já tem conta? <a href="login.html" class="link-destaque">Faça o Login</a></p>
      </div>
    </article>
  </main>
  
  <footer style="margin-top: auto;"><p>&copy; 2026 Help-Tec.</p></footer>
